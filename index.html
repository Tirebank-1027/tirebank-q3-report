<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>경영전략본부 2026년 3분기 실적보고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+KR:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#070d1a; --bg1:#0e1a33; --bg2:#16264a;
  --gold:#d9b66f; --gold2:#f3dca4; --red:#e5303b; --blue:#6aa7e6; --mint:#5fd0b0;
  --ink:#f5f2ea; --mute:#a9b3c9; --card:rgba(255,255,255,.065); --line:rgba(255,255,255,.14);
  --sans:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --serif:'Noto Serif KR','Batang',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#03060e;color:var(--ink);font-family:var(--sans);overflow:hidden}
button{font-family:inherit;cursor:pointer}

/* ===== stage ===== */
#viewport{position:fixed;inset:0 0 64px 0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{width:1920px;height:1080px;flex:none;position:relative;transform-origin:center center;
  background:radial-gradient(1200px 800px at 80% -10%,#21386b 0%,transparent 60%),radial-gradient(900px 700px at -10% 110%,#2a1a3a 0%,transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg0));
  overflow:hidden;box-shadow:0 30px 120px #000;perspective:2600px}
#stage::before{content:"";position:absolute;inset:0;background:
  linear-gradient(115deg,transparent 40%,rgba(217,182,111,.05) 50%,transparent 60%);pointer-events:none}
.slide{position:absolute;inset:0;padding:64px 96px 150px;opacity:0;pointer-events:none;transform:translateZ(-300px) rotateY(6deg);transition:opacity .6s,transform .8s cubic-bezier(.2,.7,.2,1);visibility:hidden}
.slide.active{opacity:1;pointer-events:auto;transform:none;visibility:visible}
.slide.past{transform:translateZ(-300px) rotateY(-6deg)}

/* header */
.hd{display:flex;align-items:center;gap:28px;margin-bottom:34px;position:relative}
.hd .sec{font-family:var(--serif);font-weight:800;font-size:34px;color:#1a1305;background:linear-gradient(135deg,var(--gold2),var(--gold));
  min-width:76px;height:76px;border-radius:20px;display:grid;place-items:center;box-shadow:0 12px 30px rgba(217,182,111,.35), inset 0 2px 0 rgba(255,255,255,.5)}
.hd h2{font-size:54px;font-weight:900;letter-spacing:-1px;line-height:1.15}
.hd p{font-size:26px;color:var(--mute);margin-top:6px;font-weight:400}
.hd::after{content:"";position:absolute;left:0;right:0;bottom:-18px;height:1px;background:linear-gradient(90deg,var(--gold),transparent 70%)}
.brand{position:absolute;right:96px;top:44px;display:flex;align-items:center;gap:12px;opacity:.9}
.brand img{height:54px;filter:drop-shadow(0 6px 10px #0008)}
.pg{position:absolute;right:96px;bottom:118px;font-size:22px;color:var(--mute);letter-spacing:2px}

/* generic */
.glass{background:var(--card);border:1px solid var(--line);border-radius:28px;backdrop-filter:blur(8px);
  box-shadow:0 24px 50px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12)}
.row{display:flex;gap:28px}.col{display:flex;flex-direction:column;gap:24px}
.grow{flex:1;min-width:0}
.gold{color:var(--gold2)} .red{color:#ff6b73} .blue{color:var(--blue)} .mint{color:var(--mint)} .mute{color:var(--mute)}
.big{font-weight:900;letter-spacing:-2px;line-height:1}
.lbl{font-size:26px;color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 20px;border-radius:999px;font-size:26px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.chip.g{background:rgba(217,182,111,.16);border-color:rgba(217,182,111,.5);color:var(--gold2)}
.chip.r{background:rgba(229,48,59,.18);border-color:rgba(229,48,59,.55);color:#ffb3b8}
.tag{font-size:22px;font-weight:700;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
ul.pts{list-style:none;display:flex;flex-direction:column;gap:16px}
ul.pts li{font-size:30px;line-height:1.4;padding-left:36px;position:relative}
ul.pts li::before{content:"";position:absolute;left:4px;top:.55em;width:14px;height:14px;border-radius:4px;background:linear-gradient(135deg,var(--gold2),var(--gold));transform:rotate(45deg)}
.num{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:28px;color:#1a1305;background:linear-gradient(135deg,var(--gold2),var(--gold));flex:none;box-shadow:0 8px 18px rgba(217,182,111,.3)}

/* reveal */
.slide.active .rv{animation:rv .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*.12s + .15s)}
@keyframes rv{from{opacity:0;transform:translateY(34px) translateZ(0)}to{opacity:1;transform:none}}
.slide:not(.active) .rv{opacity:0}

/* 3D photo */
.tilt{transform-style:preserve-3d;transition:transform .25s ease-out;will-change:transform}
.ph{position:relative;border-radius:22px;overflow:visible;transform-style:preserve-3d}
.ph img{display:block;width:100%;height:100%;object-fit:cover;border-radius:22px;
  box-shadow:0 2px 0 rgba(255,255,255,.35) inset,0 18px 30px rgba(0,0,0,.45),0 40px 70px rgba(0,0,0,.45);border:3px solid rgba(255,255,255,.92)}
.ph::before{content:"";position:absolute;inset:14px -14px -14px 14px;border-radius:22px;background:linear-gradient(135deg,var(--gold),#7b5e25);transform:translateZ(-40px);opacity:.75;filter:blur(.3px)}
.ph::after{content:"";position:absolute;inset:0;border-radius:22px;background:linear-gradient(120deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.12) 100%);pointer-events:none;transform:translateZ(2px)}
.ph.flat::before{display:none}
.cap{margin-top:14px;font-size:26px;text-align:center;color:var(--mute)}

/* ===== cover ===== */
.cover{display:flex;align-items:center;padding-top:0}
.cover .l{flex:1.2}
.cover .eyebrow{font-size:28px;letter-spacing:8px;color:var(--gold);font-weight:700}
.cover h1{font-family:var(--serif);font-size:112px;line-height:1.15;font-weight:800;margin:26px 0 28px;letter-spacing:-3px;
  background:linear-gradient(180deg,#fff,#e7d6ae);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.cover .meta{font-size:34px;color:var(--mute);display:flex;gap:30px;align-items:center}
.cover .meta b{color:var(--ink);font-weight:700}
.cover .names{margin-top:44px;font-size:26px;color:var(--mute);line-height:1.8;max-width:900px}
.cover .r{flex:.8;display:grid;place-items:center;perspective:1600px}
.logo3d{width:560px;transform:rotateY(-18deg) rotateX(8deg);transform-style:preserve-3d;animation:float 6s ease-in-out infinite;position:relative}
.logo3d img{width:100%;border-radius:36px;background:#fff;box-shadow:0 60px 90px rgba(0,0,0,.6),0 0 0 6px rgba(255,255,255,.08);position:relative;transform:translateZ(40px)}
.logo3d::before{content:"";position:absolute;inset:20px -26px -26px 26px;border-radius:40px;background:linear-gradient(135deg,var(--gold),#6a4d17);transform:translateZ(-20px);}
@keyframes float{0%,100%{transform:rotateY(-18deg) rotateX(8deg) translateY(0)}50%{transform:rotateY(-10deg) rotateX(4deg) translateY(-18px)}}
.orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5;animation:float2 9s ease-in-out infinite}
@keyframes float2{50%{transform:translateY(-30px) translateX(20px)}}

/* ===== team ===== */
.team{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 30px;margin-top:6px}
.tc{height:244px;display:flex;gap:26px;align-items:center;padding:20px 24px;border-radius:28px;position:relative;
  background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid var(--line);
  box-shadow:0 22px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);
  opacity:0;transform:translateX(-220px) rotateY(35deg) scale(.9);transition:none}
.tc.in{animation:tcIn .9s cubic-bezier(.15,.85,.25,1) forwards}
@keyframes tcIn{0%{opacity:0;transform:translateX(-220px) rotateY(35deg) scale(.9)}100%{opacity:1;transform:none}}
.tc.hot{outline:2px solid var(--gold);box-shadow:0 0 0 8px rgba(217,182,111,.12),0 22px 50px rgba(0,0,0,.5)}
.tc .ph{width:140px;height:182px;flex:none}
.tc .ph::before{inset:8px -8px -8px 8px;transform:translateZ(-20px)}
.tc .ph img{border-width:2px;border-radius:16px}
.tc .nm{font-size:44px;font-weight:900;letter-spacing:-1px}
.tc .ti{font-size:28px;color:var(--gold2);margin-top:8px;font-weight:500}
.tc .ti.empty{color:var(--mute);font-weight:300}
.tc .no{position:absolute;right:20px;top:14px;font-size:22px;color:var(--mute);font-family:var(--serif)}
.tc.sum{opacity:0;justify-content:center;flex-direction:column;text-align:center;gap:6px;background:linear-gradient(135deg,rgba(217,182,111,.22),rgba(217,182,111,.06))}
.tc.sum .big{font-size:84px}
.ribbon{display:flex;justify-content:space-between;margin-top:20px;font-size:24px;color:var(--mute)}
.arrowline{height:6px;margin-top:6px;border-radius:6px;background:linear-gradient(90deg,var(--gold),transparent);position:relative}
.arrowline::after{content:"";position:absolute;right:-2px;top:-9px;border-left:22px solid rgba(217,182,111,.0)}

/* spotlight (one by one) */
.spot{position:absolute;left:96px;right:96px;top:190px;bottom:140px;display:flex;align-items:center;justify-content:center;gap:110px;opacity:0;transition:opacity .55s ease;pointer-events:none;z-index:5}
.spot.show{opacity:1}
.spot .stagefloor{position:absolute;left:50%;bottom:-6px;width:1100px;height:120px;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(217,182,111,.35),transparent 70%)}
.sp-ph{position:relative;height:790px;aspect-ratio:3/4;flex:none;transform:translateY(30px) scale(.94);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.spot.show .sp-ph{transform:none}
.sp-ph.full{aspect-ratio:2/3;height:790px}
.sp-ph img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:30px;border:4px solid rgba(255,255,255,.92);box-shadow:0 30px 60px rgba(0,0,0,.5),0 60px 110px rgba(0,0,0,.5);display:block}
.sp-ph.full img{object-fit:contain;border:0;box-shadow:none;border-radius:0;filter:drop-shadow(0 40px 50px rgba(0,0,0,.6))}
.sp-ph::before{content:"";position:absolute;inset:20px -20px -20px 20px;border-radius:30px;background:linear-gradient(135deg,var(--gold),#6a4d17);opacity:.7;transform:translateZ(-40px)}
.sp-ph.full::before{display:none}
.sp-tx{transform:translateX(40px);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.spot.show .sp-tx{transform:none}
.sp-no{font-family:var(--serif);font-size:34px;color:var(--gold);letter-spacing:6px}
.sp-nm{font-family:var(--serif);font-size:170px;font-weight:800;line-height:1.1;margin:8px 0 14px;background:linear-gradient(180deg,#fff,#e7d6ae);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp-ti{font-size:58px;font-weight:500;color:var(--gold2)}
.sp-bar{width:240px;height:8px;border-radius:8px;margin-top:34px;background:linear-gradient(90deg,var(--gold),transparent)}

/* section divider */
.divider{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding-bottom:60px}
.divider .rn{font-family:var(--serif);font-size:300px;font-weight:800;line-height:1;background:linear-gradient(180deg,var(--gold2),rgba(217,182,111,.15));-webkit-background-clip:text;background-clip:text;color:transparent}
.divider h2{font-family:var(--serif);font-size:86px;font-weight:800;margin-top:6px;line-height:1.25}
.divider p{font-size:32px;color:var(--mute);margin-top:22px}

/* grid cards */
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:26px}
.top10{padding:28px 26px;border-radius:26px;height:316px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.top10 .n{font-family:var(--serif);font-weight:800;font-size:26px;color:var(--gold)}
.top10 h4{font-size:30px;font-weight:700;margin:10px 0 auto;line-height:1.3}
.top10 .v{font-size:56px;font-weight:900;letter-spacing:-2px;color:var(--gold2);line-height:1}
.top10 .u{font-size:24px;color:var(--mute);margin-top:8px}
.top10::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(217,182,111,.25),transparent 70%)}

/* chips grid */
.firms{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.firm{font-size:23px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.firm i{font-style:normal;color:var(--gold);margin-right:8px;font-weight:700}
.firm.new{background:linear-gradient(135deg,rgba(229,48,59,.35),rgba(229,48,59,.12));border-color:rgba(229,48,59,.7);font-weight:700}
.firm.new i{color:#ffb3b8}

/* timeline */
.tl{display:flex;position:relative;gap:0;margin-top:10px}
.tl::before{content:"";position:absolute;left:4%;right:4%;top:34px;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--gold),rgba(217,182,111,.25))}
.tn{flex:1;position:relative;padding:0 14px;text-align:center}
.tn .dot{width:70px;height:70px;border-radius:50%;margin:0 auto 20px;display:grid;place-items:center;font-weight:900;font-size:28px;color:#1a1305;
  background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 0 0 10px rgba(217,182,111,.15),0 12px 26px rgba(0,0,0,.4);position:relative}
.tn.win .dot{background:linear-gradient(135deg,#fff4cf,#f0b93a);box-shadow:0 0 0 10px rgba(240,185,58,.25),0 0 50px rgba(240,185,58,.6)}
.tn .dt{font-size:30px;font-weight:700;color:var(--gold2)}
.tn .tt{font-size:27px;line-height:1.45;margin-top:10px;color:var(--ink)}
.tn .st{font-size:23px;color:var(--mute);margin-top:8px;line-height:1.4}

/* flow / chevrons */
.flow{display:flex;align-items:stretch;gap:0}
.fb{flex:1;padding:30px 28px;position:relative;border-radius:24px}
.fa{width:70px;display:grid;place-items:center;flex:none;color:var(--gold);font-size:44px}
.fb h4{font-size:32px;font-weight:700;margin-bottom:14px}
.fb p,.fb li{font-size:26px;line-height:1.5;color:#dfe5f3}

/* bars */
.bars{display:flex;flex-direction:column;gap:14px}
.bar{display:grid;grid-template-columns:290px 1fr 150px;align-items:center;gap:18px;font-size:28px}
.bar .tk{height:36px;border-radius:12px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
.bar .tk i{display:block;height:100%;width:0;border-radius:12px;background:linear-gradient(90deg,#8a6b2c,var(--gold2));box-shadow:0 0 20px rgba(217,182,111,.35);transition:width 1.6s cubic-bezier(.2,.8,.2,1) .4s}
.slide.active .bar .tk i{width:var(--w)}
.bar .v{text-align:right;font-weight:700;color:var(--gold2)}
.bar.b2 .tk i{background:linear-gradient(90deg,#2b5fa3,var(--blue));box-shadow:0 0 20px rgba(106,167,230,.35)}
.bar.b3 .tk i{background:linear-gradient(90deg,#a3262d,#ff6b73);box-shadow:0 0 20px rgba(229,48,59,.35)}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.kpi{padding:26px 28px;border-radius:26px}
.kpi .k{font-size:24px;color:var(--mute)}
.kpi .n{font-size:72px;font-weight:900;letter-spacing:-3px;line-height:1.05;margin:6px 0}
.kpi .n small{font-size:34px;font-weight:700;margin-left:6px;letter-spacing:0}
.kpi .s{font-size:24px;color:var(--mint)}

/* chart */
.legend{display:flex;gap:26px;font-size:24px;color:var(--mute)}
.legend i{display:inline-block;width:18px;height:18px;border-radius:5px;margin-right:8px;vertical-align:-2px}
svg text{font-family:var(--sans)}
.dsh{stroke-dasharray:10 8}

/* before / after */
.ba{display:flex;align-items:center;justify-content:center;gap:44px;perspective:1800px}
.ba .side{width:760px}
.ba .ph{height:520px}
.ba .ph img{object-fit:cover}
.ba .side .tg{display:inline-block;margin-bottom:16px;font-size:30px;font-weight:700;padding:8px 26px;border-radius:999px}
.ba .side.b .tg{background:rgba(255,255,255,.1);border:1px solid var(--line);color:var(--mute)}
.ba .side.a .tg{background:rgba(95,208,176,.2);border:1px solid var(--mint);color:var(--mint)}
.ba .mid{font-size:80px;color:var(--gold)}
.tabs{display:flex;gap:16px;margin-bottom:26px}
.tab{padding:12px 34px;border-radius:999px;font-size:30px;font-weight:700;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--mute);transition:.3s}
.tab.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1305;border-color:transparent;box-shadow:0 10px 26px rgba(217,182,111,.4)}
.swap{animation:swap .8s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;transform:rotateY(40deg) translateX(40px)}to{opacity:1;transform:none}}

/* stamp */
.stamp{font-family:var(--serif);font-weight:800;font-size:64px;color:#ff6b73;border:6px solid #ff6b73;border-radius:20px;padding:6px 34px;transform:rotate(-8deg);display:inline-block;letter-spacing:6px;
  box-shadow:0 0 30px rgba(229,48,59,.35)}

/* waterfall */
.wf{display:flex;align-items:flex-end;justify-content:center;gap:40px;height:520px;position:relative;padding-bottom:60px}
.wf .c{width:250px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.wf .blk{width:100%;border-radius:18px 18px 8px 8px;display:grid;place-items:center;font-size:52px;font-weight:900;box-shadow:0 20px 40px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.3);transform-origin:bottom;transform:scaleY(0)}
.slide.active .wf .blk{animation:grow 1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.35s + .4s)}
@keyframes grow{to{transform:scaleY(1)}}
.wf .cl{position:absolute;bottom:-56px;font-size:27px;text-align:center;width:300px;color:var(--mute)}

/* thanks */
.thanks{display:grid;place-items:center;text-align:center;padding-bottom:40px}
.thanks h1{font-family:var(--serif);font-size:170px;font-weight:800;background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.thanks p{font-size:34px;color:var(--mute);margin-top:20px}

/* subtitle */
#sub{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);max-width:1560px;min-height:62px;padding:14px 36px;font-size:32px;line-height:1.45;text-align:center;
  background:rgba(4,8,18,.78);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(8px);z-index:20;transition:opacity .3s;opacity:0}
#sub.on{opacity:1}

/* controls */
#bar{position:fixed;left:0;right:0;bottom:0;height:64px;background:#060b16;border-top:1px solid #1d2842;display:flex;align-items:center;gap:10px;padding:0 16px;z-index:50;font-size:15px}
#bar button,#bar select{height:40px;border-radius:10px;border:1px solid #2a3858;background:#101a31;color:#e9eefb;padding:0 14px;font-size:15px}
#bar button:hover{background:#18284a}
#bar button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1305;border-color:transparent;font-weight:700}
#bar .prog{flex:1;height:8px;background:#16213b;border-radius:8px;overflow:hidden;cursor:pointer;min-width:60px}
#bar .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .5s}
#bar .cnt{color:#9fb0d3;min-width:64px;text-align:center}
#bar input[type=range]{width:84px}
#bar label{color:#9fb0d3;display:flex;align-items:center;gap:6px}
#bar button,#bar label,#bar .cnt{white-space:nowrap;flex:none}
@media (max-width:1000px){#bar select,#bar label.sp,#bar #bEdit{display:none}}
@media (max-width:640px){#bar label{display:none}}

/* start overlay + modal */
.ov{position:fixed;inset:0;background:rgba(3,6,14,.9);z-index:100;display:grid;place-items:center;backdrop-filter:blur(10px)}
.ov.hide{display:none}
.box{background:linear-gradient(160deg,#14224a,#0b1328);border:1px solid var(--line);border-radius:28px;padding:44px 52px;max-width:760px;width:92%;text-align:center;box-shadow:0 40px 100px #000}
.box h3{font-family:var(--serif);font-size:34px;margin-bottom:8px}
.box p{color:var(--mute);line-height:1.6;margin-bottom:28px}
.box .btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.box button{padding:16px 30px;border-radius:14px;border:1px solid var(--line);background:#101a31;color:#fff;font-size:18px}
.box button.pri{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1305;font-weight:700;border:0}
.edit{text-align:left;display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin-bottom:24px}

<body>

<div id="viewport"><div id="stage"><div id="sub"></div></div></div>

<div id="bar">

  <button id="bNext" title="다음 (→)">▶▶</button>
  <span class="cnt" id="cnt">1 / 1</span>
  <div class="prog" id="prog"><i></i></div>
  <label><input type="checkbox" id="cbAuto"> 자동 넘김</label>
  <label><input type="checkbox" id="cbSub" checked> 자막</label>
  <label class="sp">속도 <input type="range" id="rate" min="0.8" max="1.3" step="0.05" value="1"></label>
  <label class="sp">톤 <input type="range" id="pitch" min="0.7" max="1.4" step="0.05" value="1"></label>
  <select id="voice" title="AI 음성"></select>
  <button id="bEdit" title="직급 입력 (E)">직급 입력</button>
  <button id="bFull" title="전체화면 (F)">⛶</button>
</div>

<div class="ov" id="start">
  <div class="box">
    <h3>경영전략본부 2026년 3분기 실적보고</h3>
    <p>AI 음성이 슬라이드마다 발표 대본을 읽어 줍니다.<br>음성은 브라우저 정책상 아래 버튼을 눌러야 시작됩니다.<br>(←, → 이동 · Space 낭독 일시정지 · F 전체화면 · E 직급 입력)</p>
    <div class="btns">
      <button class="pri" id="goVoice">▶ AI 음성으로 발표 시작</button>
      <button id="goSilent">화면만 보기</button>
    </div>
  </div>
</div>

<div class="ov hide" id="editor">
  <div class="box">
    <h3>직급 입력</h3>
    <p>팀원 소개 화면과 음성에 사용됩니다. 이 브라우저에 저장됩니다.</p>
    <div class="edit" id="editForm"></div>
    <div class="btns"><button class="pri" id="edSave">저장</button><button id="edCancel">닫기</button></div>
  </div>
</div>

<script>
/* ============ DATA ============ */
const TEAM=[
 {n:'이현희',p:'p1'},{n:'김호철',p:'p2'},{n:'조은희',p:'p3'},{n:'이은영',p:'p4'},
 {n:'최은지',p:'p5'},{n:'문장한',p:'p6'},{n:'최병익',p:'p7'},{n:'박성준',p:'p8'},
 {n:'최기윤',p:'p9'},{n:'정현우',p:'p10'},{n:'임성윤',p:'p11'}
];
let TITLES={}; try{TITLES=JSON.parse(localStorage.getItem('titles')||'{}')}catch(e){}
const FIRMS=['타이어뱅크㈜','성공을만드는㈜','재미슨㈜','농업법인㈜풍년농사','㈜최고좋은터 행복한집','㈜AP홀딩스','성공㈜','건물코디뱅크㈜','파이프뱅크','선농종합식품㈜','㈜파멥신','에어프레미아㈜','㈜폴리텍','㈜영종도','농업법인㈜좋은농사','재단법인 성공사','성공정보통신㈜','좋은타이어㈜','㈜원풍약품상사','㈜AP랩스','굿타이어㈜','심뱅스㈜'];
const MON=['1월','2월','3월','4월','5월','6월','7월','8월','9월'];
const CHG=[35,32,46,36,35,33,38,37,30], REN=[28,28,31,33,38,40,31,26,18];
const REG=[['세종특별자치시',22323],['충남 천안시',15385],['인천광역시',12645],['대전광역시',1685],['충남 공주시',567],['경북 경주시',416],['경기 시흥시',308],['전북특별자치도',280],['경기 안산시',200],['경기 양주시',184],['전남광주통합특별시',138],['충남 부여군',33]];

/* ============ HELPERS ============ */
const H=(sec,t,s)=>`<div class="hd rv" style="--i:0"><div class="sec">${sec}</div><div><h2>${t}</h2>${s?`<p>${s}</p>`:''}</div></div><div class="brand"><img src="assets/logo.png" alt=""></div>`;
const photo=(src,cls='')=>`<div class="ph tilt ${cls}"><img src="assets/${src}" alt=""></div>`;
function combo(){
  const W=1060,Hh=400,l=60,b=46,t=20,mx=50,bw=34,gp=(W-l-20)/9;
  let s=`<svg viewBox="0 0 ${W} ${Hh+b+t}" width="100%">`;
  for(let v=0;v<=50;v+=10){const y=t+Hh*(1-v/mx);s+=`<line x1="${l}" x2="${W-10}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.1)"/><text x="${l-12}" y="${y+7}" fill="#a9b3c9" font-size="20" text-anchor="end">${v}</text>`}
  const y30=t+Hh*(1-30/mx);
  s+=`<line class="dsh" x1="${l}" x2="${W-10}" y1="${y30}" y2="${y30}" stroke="#ff6b73" stroke-width="2.5"/><text x="${W-12}" y="${y30-10}" fill="#ff8f96" font-size="21" text-anchor="end" font-weight="700">관리 목표 월 30건</text>`;
  CHG.forEach((v,i)=>{const x=l+gp*i+gp/2-bw-2,h=Hh*v/mx,hot=[2,6,7].includes(i);
    s+=`<rect x="${x}" y="${t+Hh-h}" width="${bw}" height="${h}" rx="7" fill="${hot?'#ff6b73':'#d9b66f'}"/><text x="${x+bw/2}" y="${t+Hh-h-8}" fill="${hot?'#ffb3b8':'#f3dca4'}" font-size="20" font-weight="700" text-anchor="middle">${v}</text>`;
    const v2=REN[i],h2=Hh*v2/mx,x2=x+bw+4;
    s+=`<rect x="${x2}" y="${t+Hh-h2}" width="${bw}" height="${h2}" rx="7" fill="#6aa7e6"/><text x="${x2+bw/2}" y="${t+Hh-h2-8}" fill="#b5d5f5" font-size="20" text-anchor="middle">${v2}</text>`;
    s+=`<text x="${l+gp*i+gp/2}" y="${t+Hh+34}" fill="#a9b3c9" font-size="22" text-anchor="middle">${MON[i]}</text>`});
  return s+'</svg>';
}
const comboSvg=()=>combo().replace('width="100%"','width="100%" style="height:380px"');
function donut(a,b){const r=100,c=2*Math.PI*r,f=c*a/b;
  return `<svg viewBox="0 0 260 260" width="300"><circle cx="130" cy="130" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="34"/>
  <circle cx="130" cy="130" r="${r}" fill="none" stroke="url(#gd)" stroke-width="34" stroke-linecap="round" stroke-dasharray="0 ${c}" transform="rotate(-90 130 130)" class="dn" data-f="${f}" data-c="${c}"/>
  <defs><linearGradient id="gd"><stop offset="0" stop-color="#f3dca4"/><stop offset="1" stop-color="#b88a2e"/></linearGradient></defs>
  <text x="130" y="128" text-anchor="middle" fill="#f5f2ea" font-size="60" font-weight="900">${a}</text><text x="130" y="168" text-anchor="middle" fill="#a9b3c9" font-size="26">/ ${b}개 법인</text></svg>`}

/* ============ SLIDES ============ */
const SL=[];
const add=o=>SL.push(o);

add({cls:'cover',html:()=>`
 <div class="orb" style="width:340px;height:340px;right:60px;top:-80px;background:radial-gradient(circle,#3b64c4,transparent 70%)"></div>
 <div class="orb" style="width:260px;height:260px;left:40%;bottom:40px;background:radial-gradient(circle,#c9a25a,transparent 70%);animation-delay:-3s"></div>
 <div class="l"><div class="eyebrow rv" style="--i:0">QUARTERLY PERFORMANCE REPORT</div>
 <h1 class="rv" style="--i:1">2026년<br>3분기 실적보고서</h1>
 <div class="meta rv" style="--i:2"><b>경영전략본부</b><span>·</span><span>2026. 10. 27</span></div>
 <div class="names rv" style="--i:3">${TEAM.map(t=>t.n).join('  ·  ')}</div></div>
 <div class="r rv" style="--i:2"><div class="logo3d"><img src="assets/logo.png" alt="TIRE BANK"></div></div>`,
 say:[["안녕하십니까. 경영전략본부 2026년 3분기 실적보고를 시작하겠습니다."],["오늘 보고는 3분기 업무 성과와 4분기 중점 추진 목표, 두 가지로 구성되어 있습니다."]]});

add({id:'team',html:()=>`${H('팀','경영전략본부 부서원 소개','함께 만든 3분기 성과 · 총 11명')}
 <div class="spot" id="spot"><div class="stagefloor"></div><div class="sp-ph tilt"><img id="spImg" alt=""></div><div class="sp-tx"><div class="sp-no" id="spNo"></div><div class="sp-nm" id="spNm"></div><div class="sp-ti" id="spTi"></div><div class="sp-bar"></div></div></div>
 <div class="team">${TEAM.map((t,i)=>{const ti=TITLES[t.n];return `<div class="tc" data-i="${i}"><div class="no">${String(i+1).padStart(2,'0')}</div>${photo(t.p+'.jpg','')}<div><div class="nm">${t.n}</div><div class="ti ${ti?'':'empty'}">${ti||'경영전략본부'}</div></div></div>`}).join('')}

`,

  ...TEAM.map((t,i)=>[`${t.n}${TITLES[t.n]?' '+TITLES[t.n]:''}`,()=>teamIn(i)]),
  ["이상 열한 명의 경영전략본부 구성원이, 지금부터 3분기 성과를 보고드리겠습니다.",()=>teamIn(11)]]});

add({cls:'divider',html:()=>`<div class="rn rv" style="--i:0">Ⅰ</div><h2 class="rv" style="--i:1">2026년 3분기<br>업무성과 보고</h2><p class="rv" style="--i:2">한눈에 보는 10대 성과부터 세부 내용까지</p>`,

const T10=[['관리법인 현황','22','개 (+2)'],['관리법인 자체기장','17','개 법인 자체 신고'],['소득금액변동통지 승소','25','억 환급 진행'],['원풍약품상사 재고실사','1.8','억 법인세 절감'],['에어프레미아 파견','2','개월 RA 업무 지원'],['좋은타이어 회계 변경','9','개 매장 자동전표'],['농업법인 농지 자경','54,164','평 자경 완료'],['지방세 서면조사','적정','추징세액 없음'],['MMDA·여신금리','595','건 금리 관리 계약 연계'],['위수탁사업계약서','595','건 작성 완료']];
T10[8]=['MMDA·여신금리','2.5','% 농협 MMDA 금리'];
add({html:()=>`${H('Ⅰ','한눈에 보는 10대 성과','2026년 3분기 경영전략본부')}
 <div class="g5" style="margin-top:6px">${T10.map((c,i)=>`<div class="top10 glass tilt rv" style="--i:${i+1}"><div class="n">${['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ','Ⅷ','Ⅸ','Ⅹ'][i]}</div><h4>${c[0]}</h4><div class="v">${c[1]}</div><div class="u">${c[2]}</div></div>`).join('')}</div>`,
 say:[["3분기 성과를 열 가지로 요약했습니다."],["관리법인은 22개로 늘었고, 17개 법인은 자체 기장으로 신고를 수행했습니다."],["소득금액변동통지 소송에서는 승소하여 약 25억 원 환급이 진행 중이고, 원풍약품상사 재고실사로 법인세 1억 8천만 원을 절감할 수 있게 되었습니다."],["에어프레미아 파견과 좋은타이어 회계프로그램 연동, 농업법인 농지 자경 54,164평 완료, 지방세 서면조사 적정 결과도 있었습니다."],["마지막으로 MMDA 금리 관리와 위수탁사업계약서 595건 작성까지 완료했습니다. 하나씩 말씀드리겠습니다."]]});

add({html:()=>`${H('Ⅰ','2026년 3분기 관계사 관리법인 현황','체계적인 업무 분장으로 증가한 법인에 효율적으로 대응')}
 <div class="row" style="align-items:center;margin-bottom:34px">
  <div class="glass rv" style="--i:1;padding:26px 44px;display:flex;align-items:center;gap:34px"><div style="text-align:center"><div class="lbl">2025년</div><div class="big mute" style="font-size:110px"><span class="cnt" data-to="20">0</span><small style="font-size:36px">개</small></div></div>
  <div class="gold" style="font-size:70px">➜</div><div style="text-align:center"><div class="lbl">2026년</div><div class="big gold" style="font-size:130px"><span class="cnt" data-to="22">0</span><small style="font-size:40px">개</small></div></div>
  <div class="chip g" style="font-size:34px;padding:12px 28px">관리법인 +2</div></div>
  <div class="grow rv" style="--i:2"><div class="tl" style="margin-top:0"><div class="tn"><div class="dot">1</div><div class="dt">2026.01</div><div class="tt">굿타이어㈜ 신규 설립</div></div><div class="tn"><div class="dot">4</div><div class="dt">2026.04</div><div class="tt">㈜파멥신 경영권 확보</div></div><div class="tn"><div class="dot">7</div><div class="dt">2026.07</div><div class="tt">심뱅스㈜ 경영권 확보</div></div></div></div></div>
 <div class="firms rv" style="--i:3">${FIRMS.map((f,i)=>`<div class="firm ${i>=20?'new':''}"><i>${i+1}</i>${f}${i>=20?' NEW':''}</div>`).join('')}</div>`,
 say:[["첫 번째, 관계사 관리법인 현황입니다."],["지난해 20개였던 관리법인이 올해 22개로 두 개 늘었습니다.",()=>runCnt()],["1월에 굿타이어를 신규 설립했고, 4월에는 파멥신, 7월에는 심뱅스의 경영권을 확보했습니다."],["법인이 늘어난 만큼 체계적인 업무 분장을 통해 효율적으로 대응하고 있습니다."]]});

add({html:()=>`${H('Ⅱ','관리법인 자체 기장','자금 · 세무 · 회계 · 총무 · 인사 자체 장부 → 빠르고 정확한 의사결정')}
 <div class="row" style="gap:30px">
 <div class="glass rv" style="--i:1;padding:34px 36px;width:640px"><div class="tag">세무회계 · 부가가치세</div>
  <div style="display:flex;align-items:center;gap:20px;margin:10px 0">${donut(17,22)}<div><div class="lbl">22개 중</div><div style="font-size:34px;font-weight:700;margin:6px 0">5개 법인 제외</div><div class="chip g">17개 자체 신고·납부</div></div></div></div>
 <div class="glass rv" style="--i:2;padding:34px 36px;flex:1"><div class="tag">세금업무 · 주민세 사업소분</div>
  <div class="row" style="align-items:center;margin-top:18px;gap:22px"><div class="big gold" style="font-size:130px"><span class="cnt" data-to="539">0</span></div><div><div style="font-size:34px;font-weight:700">개 지자체</div><div class="lbl" style="margin-top:10px">타이어뱅크 사업소분<br>직접 신고·납부 완료</div></div></div>
  <div class="chip g" style="margin-top:22px">외부 위탁 없이 자체 수행</div></div></div>
 <div class="tag rv" style="--i:3;margin:34px 0 14px">재무회계 · 기업가치 극대화</div>
 <div class="flow">
  <div class="fb glass rv" style="--i:3"><div class="row" style="align-items:center"><div class="num">1</div><h4 style="margin:0">월간 손익계산서</h4></div><p style="margin-top:12px">매월 15일 보고로<br>경영자 의사결정 기여</p></div><div class="fa">➜</div>
  <div class="fb glass rv" style="--i:4"><div class="row" style="align-items:center"><div class="num">2</div><h4 style="margin:0">미수채권 관리</h4></div><p style="margin-top:12px">회수 기일 검토로<br>대손채권 방지</p></div><div class="fa">➜</div>
  <div class="fb glass rv" style="--i:5"><div class="row" style="align-items:center"><div class="num">3</div><h4 style="margin:0">손익분기점 분석</h4></div><p style="margin-top:12px">분석을 통한<br>원가 통제</p></div></div>`,
 say:[["두 번째는 관리법인 자체 기장입니다. 자금, 세무, 회계, 총무, 인사까지 자체 장부를 운영하여 빠르고 정확한 의사결정을 돕고 있습니다."],["세무 분야에서는 관계사 22개 법인 중 5개 법인을 제외한 17개 법인의 부가가치세를 자체적으로 신고하고 납부했습니다.",()=>runDonut()],["또한 타이어뱅크의 539개 지자체 사업소분 주민세도 직접 신고하고 납부를 완료했습니다.",()=>runCnt()],["재무회계 측면에서는 매월 15일 월간 손익계산서를 보고하고, 매출채권 회수 기일을 검토해 대손채권을 예방하며, 손익분기점 분석으로 원가를 통제하고 있습니다."]]});

/* ============ BUILD ============ */
const stage=document.getElementById('stage'),sub=document.getElementById('sub');
function buildAll(){
  stage.querySelectorAll('.slide').forEach(e=>e.remove());
  SL.forEach((s,i)=>{const d=document.createElement('section');d.className='slide '+(s.cls||'');d.innerHTML=s.html()+`<div class="pg">${i+1} / ${SL.length}</div>`;stage.insertBefore(d,sub);s.el=d});
}
buildAll();

/* scale */
function fit(){const vh=innerHeight-64,k=Math.min(innerWidth/1920,vh/1080);stage.style.transform=`scale(${k})`;const vp=document.getElementById('viewport');stage.style.margin=`${-(1080*(1-k))/2}px ${-(1920*(1-k))/2}px`}
addEventListener('resize',fit);fit();

/* 3D tilt */
document.addEventListener('mousemove',e=>{
  const t=e.target.closest&&e.target.closest('.tilt');
  document.querySelectorAll('.tilt.hv').forEach(x=>{if(x!==t){x.classList.remove('hv');x.style.transform=''}});
  if(!t)return;const r=t.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;
  t.classList.add('hv');t.style.transform=`perspective(900px) rotateY(${px*16}deg) rotateX(${-py*14}deg) translateZ(14px)`;
});

function cur(){return SL[idx].el}
function runCnt(){cur().querySelectorAll('.cnt').forEach(el=>{const to=+el.dataset.to,t0=performance.now(),d=1500;(function f(t){const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e).toLocaleString();if(p<1)requestAnimationFrame(f)})(t0)})}
function runDonut(){cur().querySelectorAll('.dn').forEach(c=>{c.style.transition='stroke-dasharray 1.6s cubic-bezier(.2,.8,.2,1)';requestAnimationFrame(()=>c.setAttribute('stroke-dasharray',`${c.dataset.f} ${c.dataset.c}`))})}
let spTimer=null;
function teamIn(i){const s=cur(),sp=s.querySelector('#spot');clearTimeout(spTimer);
  if(i>=11){sp.classList.remove('show');spTimer=setTimeout(()=>s.querySelectorAll('.tc').forEach((c,k)=>setTimeout(()=>c.classList.add('in'),k*140)),600);return}
  const m=TEAM[i];sp.classList.remove('show');
  spTimer=setTimeout(()=>{const ph=sp.querySelector('.sp-ph'),im=sp.querySelector('#spImg');
    ph.classList.remove('full');im.onerror=null;
    im.onload=()=>{ph.classList.toggle('full',im.dataset.mode==='full')};
    im.dataset.mode='full';im.onerror=()=>{im.onerror=null;im.dataset.mode='bust';im.src=`assets/${m.p}.jpg`;ph.classList.remove('full')};
    im.src=`assets/full${i+1}.jpg`;
    sp.querySelector('#spNo').textContent=String(i+1).padStart(2,'0')+' / 11';sp.querySelector('#spNm').textContent=m.n;sp.querySelector('#spTi').textContent=TITLES[m.n]||'경영전략본부';
    sp.classList.add('show')},i===0?50:650)}
function baSet(i){const s=cur(),L=[['sejong'],['daejeon'],['jeonbuk']][i][0];
  s.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('on',k==i));
  const b=s.querySelector('.ba');b.querySelector('.b .ph img').src=`assets/${L}_before.jpg`;b.querySelector('.a .ph img').src=`assets/${L}_after.jpg`;
  b.classList.remove('swap');void b.offsetWidth;b.classList.add('swap')}
document.addEventListener('click',e=>{const t=e.target.closest('.tab');if(t&&cur().querySelector('.ba'))baSet(+t.dataset.r)});
/* make non-narrated entry state work */
function resetSlide(i){const s=SL[i].el;clearTimeout(spTimer);const spo=s.querySelector('.spot');if(spo)spo.classList.remove('show');s.querySelectorAll('.tc').forEach(c=>{c.classList.remove('in','hot')});
  s.querySelectorAll('.cnt').forEach(c=>c.textContent='0');
  s.querySelectorAll('.dn').forEach(c=>{c.style.transition='none';c.setAttribute('stroke-dasharray',`0 ${c.dataset.c}`)});
  const b=s.querySelector('.ba');if(b){baSet(0);b.classList.remove('swap')}
  // restart css reveal animations
  s.classList.remove('active');void s.offsetWidth}

/* ============ NAVIGATION + SPEECH ============ */
let idx=0,voiceOn=false,playing=false,token=0,voices=[],curVoice=null,timer=null;
const $=id=>document.getElementById(id);
function show(i,fromUser){
  i=Math.max(0,Math.min(SL.length-1,i));
  SL.forEach((s,k)=>{s.el.classList.toggle('past',k<i);if(k!==i)s.el.classList.remove('active')});
  idx=i;resetSlide(i);SL[i].el.classList.add('active');
  $('cnt').textContent=`${i+1} / ${SL.length}`;$('prog').firstElementChild.style.width=((i+1)/SL.length*100)+'%';
  if(i!==0||fromUser!==undefined||playing)runSlide();
}
function stopAll(){token++;clearTimeout(timer);if('speechSynthesis' in window)speechSynthesis.cancel();sub.classList.remove('on')}
function segs(){const s=SL[idx].say;return typeof s==='function'?s():s}
function runSlide(){
  stopAll();const my=token,list=segs();let k=0;
  const nextSlide=()=>{if(my!==token)return;if(playing&&$('cbAuto').checked&&idx<SL.length-1){timer=setTimeout(()=>{if(my===token)show(idx+1,true)},900)}else if(idx>=SL.length-1){setPlay(false)}};
  const step=()=>{if(my!==token)return;if(k>=list.length)return nextSlide();
    const [txt,fn]=list[k++];if(fn)try{fn()}catch(e){console.warn(e)}
    if($('cbSub').checked&&voiceOn&&playing){sub.textContent=txt;sub.classList.add('on')}
    if(voiceOn&&playing&&'speechSynthesis' in window){
      const u=new SpeechSynthesisUtterance(txt);u.lang='ko-KR';if(curVoice)u.voice=curVoice;u.rate=+$('rate').value;u.pitch=+$('pitch').value;
      u.onend=()=>{timer=setTimeout(step,250)};u.onerror=()=>{timer=setTimeout(step,250)};speechSynthesis.speak(u);
    }else{timer=setTimeout(step,SL[idx].id==='team'&&fn?2800:(fn&&txt.length<14?900:Math.max(1200,txt.length*85)))}
  };
  if(!playing){ // silent: only run animation hooks quickly
    list.forEach(([t,fn],j)=>{if(fn)setTimeout(()=>{if(my===token)try{fn()}catch(e){}},400+j*(SL[idx].id==='team'?2800:1800))});return;
  }
  step();
}
function setPlay(on){playing=on;$('bPlay').classList.toggle('on',on);$('bPlay').textContent=on?'❚❚ 일시정지':'▶ 낭독';if(!on){stopAll()}}
$('bPlay').onclick=()=>{if(playing){setPlay(false)}else{voiceOn=true;setPlay(true);resetSlide(idx);SL[idx].el.classList.add('active');runSlide()}};
$('bNext').onclick=()=>show(idx+1,true);$('bPrev').onclick=()=>show(idx-1,true);
$('prog').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();show(Math.floor((e.clientX-r.left)/r.width*SL.length),true)};
$('bFull').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type!=='checkbox'&&e.target.type!=='range')return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){show(idx+1,true)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){show(idx-1,true)}
  else if(e.key===' '){e.preventDefault();$('bPlay').click()}else if(e.key==='f'||e.key==='F'){$('bFull').click()}else if(e.key==='e'||e.key==='E'){openEd()}});

/* voices */
function loadVoices(){voices=(speechSynthesis.getVoices()||[]).filter(v=>/^ko/i.test(v.lang));const sel=$('voice');
  const pref=voices.slice().sort((a,b)=>(/natural|neural|online|google/i.test(b.name)?1:0)-(/natural|neural|online|google/i.test(a.name)?1:0));
  sel.innerHTML=pref.length?pref.map(v=>`<option value="${v.name}">${v.name.replace(/Microsoft |Online \(Natural\) - Korean \(Korea\)/g,'').trim()}</option>`).join(''):'<option>한국어 음성 없음</option>';
  const saved=localStorage.getItem('voice');const v=pref.find(x=>x.name===saved)||pref[0];curVoice=v||null;if(v)sel.value=v.name}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
$('voice').onchange=e=>{curVoice=voices.find(v=>v.name===e.target.value);try{localStorage.setItem('voice',e.target.value)}catch(_){}if(playing)runSlide()};

/* start overlay */
$('goVoice').onclick=()=>{$('start').classList.add('hide');voiceOn=true;setPlay(true);show(0,true);if(!curVoice&&'speechSynthesis' in window)loadVoices()};
$('goSilent').onclick=()=>{$('start').classList.add('hide');voiceOn=false;setPlay(false);show(0,true)};
setPlay(false);show(0);

/* title editor */
function openEd(){$('editForm').innerHTML=TEAM.map(t=>`<div><label>${t.n}</label><input data-n="${t.n}" value="${TITLES[t.n]||''}" placeholder="예: 팀장 / 과장 / 대리"></div>`).join('');$('editor').classList.remove('hide')}
$('bEdit').onclick=openEd;$('edCancel').onclick=()=>$('editor').classList.add('hide');
$('edSave').onclick=()=>{document.querySelectorAll('#editForm input').forEach(i=>{TITLES[i.dataset.n]=i.value.trim()});try{localStorage.setItem('titles',JSON.stringify(TITLES))}catch(_){}
  $('editor').classList.add('hide');const was=idx;buildAll();show(was,true)};
</script>
</body>
</html>
